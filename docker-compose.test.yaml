name: test_database
services:
  db:
    image: postgres
    container_name: postgres_app_test_db
    environment:
      POSTGRES_DB: app_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: secret
    ports:
      - 5433:5433
    volumes:
      - pg_app_test_data:/var/lib/postgresql

volumes:
  pg_app_test_data:
